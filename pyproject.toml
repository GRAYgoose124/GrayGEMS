[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graygems"
version = "0.1.0"
description = "GrayGEMS - A modular workflow execution framework"
readme = "README.md"
authors = [
    {name = "Grayson", email = "grayson@example.com"},
]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/grayson/graygems"
Repository = "https://github.com/grayson/graygems"
Issues = "https://github.com/grayson/graygems/issues"

[tool.setuptools.packages.find]
include = ["graygems*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
